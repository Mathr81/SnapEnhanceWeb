name: Compile Userscript
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # TypeScript 6+ emits "use strict" above the ==UserScript== header
      - name: Compile typescript
        run: npx -y -p typescript@5 tsc

      - name: Check tag matches @version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "@version      ${GITHUB_REF_NAME#v}$" snapenhance.user.js

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: userscript
          path: ./snapenhance.user.js

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" snapenhance.user.js --title "$GITHUB_REF_NAME" --generate-notes
